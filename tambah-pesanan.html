<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tambah Pesanan - Soapboyz Laundry</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Soapboyz Laundry</h1>
    </header>

    <nav>
        <ul>
            <li><a href="index.html">Kembali ke Daftar Pesanan</a></li>
        </ul>
    </nav>

    <main>
        <div class="container">
            <h2>Formulir Pesanan Cucian Baru</h2>
            <form action="#" method="POST">
                
                <div class="form-group">
                    <label for="nama_pelanggan">Nama Pelanggan:</label>
                    <input type="text" id="nama_pelanggan" name="nama_pelanggan" required>
                </div>

                <div class="form-group">
                    <label for="merek_sepatu">Merek & Tipe Sepatu:</label>
                    <input type="text" id="merek_sepatu" name="merek_sepatu" required>
                </div>

                <div class="form-group">
                    <label for="layanan">Jenis Layanan Cuci:</label>
                    <select id="layanan" name="layanan">
                        <option value="fast">Fast Cleaning</option>
                        <option value="deep">Deep Cleaning</option>
                    </select>
                </div>

                <div class="form-group">
                    <button type="submit">Simpan Pesanan</button>
                    <button type="reset">Reset Batal</button>
                </div>
            </form>
        </div>
    </main>
</body>
</html>
